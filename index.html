<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondos Animados Premium</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #151518;
            --accent: #00d5a3;
            --accent-hover: #00b389;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        }

        header {
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { font-size: 1.8rem; letter-spacing: -0.5px; margin-bottom: 5px; }
        header p { color: var(--accent); font-weight: 500; font-size: 0.85rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px 4%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 213, 163, 0.15);
            border-color: rgba(0, 213, 163, 0.3);
        }
        
        .video-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            border-radius: 10px;
            overflow: hidden;
            background: #111;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-container::before {
            content: "Cargando...";
            position: absolute;
            color: var(--text-muted);
            font-size: 0.75rem;
            z-index: 1;
        }

        /* Estilo idéntico a un GIF fluido */
        .preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none; /* Evita que el usuario interactúe o abra controles */
        }
        .preview-video.loaded { opacity: 1; }

        .card h3 { font-size: 1rem; margin: 12px 0 4px; text-align: left; }
        .card p.price { color: var(--text-muted); text-align: left; margin-bottom: 12px; font-size: 0.85rem; }
        
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: auto;
        }
        .btn:hover { background: var(--accent-hover); }

        /* Modal Yape */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-content {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal.active .modal-content { transform: scale(1); }

        .modal-header { color: #8e2de2; font-size: 1.4rem; margin-bottom: 8px; font-weight: bold; }
        .qr-wrapper {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            margin: 15px auto;
            width: fit-content;
        }
        .qr-wrapper img { width: 190px; height: 190px; display: block; }
        
        .btn-wa {
            background: #25D366;
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }
        .btn-wa:hover { background: #20bd5a; }
        .btn-close {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-close:hover { background: rgba(255,255,255,0.05); color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>Fondos Animados</h1>
        <p>Catálogo Exclusivo para Celular</p>
    </header>

    <div id="gridContainer" class="grid"></div>

    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Yape</div>
            <p style="font-size: 0.9rem;">Fondo: <strong id="fondoName" style="color: var(--accent);"></strong></p>
            
            <div class="qr-wrapper">
                <img src="assets/tu_qr_yape.png" alt="QR Yape">
            </div>

            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">
                Envía tu captura de pago por WhatsApp para recibir el enlace de descarga en Mega.
            </p>
            
            <a href="#" id="whatsappLink" class="btn-wa" target="_blank">Enviar captura por WhatsApp</a>
            <button class="btn-close" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const totalFondos = 5; // Cambiar a 20 cuando subas todos tus videos

        const fondos = Array.from({ length: totalFondos }, (_, i) => ({
            id: i + 1,
            nombre: `Wallpaper Pro V${i + 1}`,
            precio: "S/ 3.00",
            videoSrc: `assets/fondo${i + 1}.mp4`
        }));

        const gridContainer = document.getElementById('gridContainer');

        fondos.forEach(fondo => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="video-container">
                    <video class="preview-video" autoplay loop muted playsinline data-src="${fondo.videoSrc}"></video>
                </div>
                <h3>${fondo.nombre}</h3>
                <p class="price">${fondo.precio}</p>
                <button class="btn" onclick="openModal('${fondo.nombre}')">Comprar</button>
            `;
            gridContainer.appendChild(card);
        });

        const videos = document.querySelectorAll('.preview-video');
        
        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    if (!video.src) {
                        video.src = video.getAttribute('data-src');
                    }
                    video.play().then(() => {
                        video.classList.add('loaded');
                    }).catch(e => console.log("Reproducción automática omitida por el navegador:", e));
                } else {
                    video.pause();
                }
            });
        }, { rootMargin: "0px 0px 150px 0px" });

        videos.forEach(video => videoObserver.observe(video));

        const modal = document.getElementById('paymentModal');
        const waNumber = "51999999999"; // REEMPLAZA CON TU NÚMERO DE WHATSAPP

        function openModal(nombreFondo) {
            document.getElementById('fondoName').innerText = nombreFondo;
            const waLink = document.getElementById('whatsappLink');
            const mensaje = encodeURIComponent(`Hola, acabo de pagar por el ${nombreFondo}. Te envío mi captura para recibir el enlace de Mega.`);
            waLink.href = `https://wa.me/${waNumber}?text=${mensaje}`;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
