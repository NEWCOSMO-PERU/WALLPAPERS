<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondos Animados Premium</title>
    <style>
        /* Variables y Reset */
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #151518;
            --accent: #00d5a3;
            --accent-hover: #00b389;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        }

        /* Encabezado Glassmorphism */
        header {
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            padding: 25px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { font-size: 2rem; letter-spacing: -0.5px; margin-bottom: 5px; }
        header p { color: var(--accent); font-weight: 500; font-size: 0.9rem; }

        /* Cuadrícula Responsive */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tarjetas */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 213, 163, 0.1);
            border-color: rgba(0, 213, 163, 0.3);
        }
        
        .video-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        .preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .preview-video.loaded { opacity: 1; }

        .card h3 { font-size: 1.1rem; margin: 15px 0 5px; text-align: left; }
        .card p.price { color: var(--text-muted); text-align: left; margin-bottom: 15px; font-size: 0.9rem; }
        
        /* Botones */
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: auto;
        }
        .btn:hover { background: var(--accent-hover); }

        /* Modal Yape */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-content {
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal.active .modal-content { transform: scale(1); }

        .modal-header { color: #6e0f6e; font-size: 1.5rem; margin-bottom: 10px; font-weight: bold; }
        .qr-wrapper {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            margin: 20px auto;
            width: fit-content;
        }
        .qr-wrapper img { width: 220px; height: 220px; display: block; }
        
        .btn-wa {
            background: #25D366;
            color: white;
            text-decoration: none;
            display: block;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-wa:hover { background: #20bd5a; }
        .btn-close {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-close:hover { background: rgba(255,255,255,0.05); color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>Fondos Premium</h1>
        <p>Catálogo Exclusivo en Alta Resolución</p>
    </header>

    <div id="gridContainer" class="grid"></div>

    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Yape</div>
            <p>Fondo: <strong id="fondoName" style="color: var(--accent);"></strong></p>
            
            <div class="qr-wrapper">
                <img src="assets/tu_qr_yape.png" alt="QR Yape">
            </div>

            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
                Envía la captura de tu pago para recibir inmediatamente el enlace de descarga directa en Mega.
            </p>
            
            <a href="#" id="whatsappLink" class="btn-wa" target="_blank">Enviar captura por WhatsApp</a>
            <button class="btn-close" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <script>
        // 1. Base de datos de los 20 fondos (Array de Objetos)
        // Esto permite escalar la web fácilmente sin tocar el HTML
        const fondos = Array.from({ length: 20 }, (_, i) => ({
            id: i + 1,
            nombre: `Wallpaper Pro V${i + 1}`,
            precio: "S/ 3.00",
            videoSrc: `assets/fondo${i + 1}.mp4` // Asegúrate de tener fondo1.mp4 hasta fondo20.mp4
        }));

        const gridContainer = document.getElementById('gridContainer');

        // 2. Renderizar tarjetas en el DOM
        fondos.forEach(fondo => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="video-container">
                    <video class="preview-video" loop muted playsinline data-src="${fondo.videoSrc}"></video>
                </div>
                <h3>${fondo.nombre}</h3>
                <p class="price">${fondo.precio}</p>
                <button class="btn" onclick="openModal('${fondo.nombre}')">Comprar Ahora</button>
            `;
            gridContainer.appendChild(card);
        });

        // 3. Lazy Loading & Intersection Observer (NIVEL PRO)
        // Reproduce los videos SOLO cuando entran en la pantalla del usuario
        const videos = document.querySelectorAll('.preview-video');
        
        const videoObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    // Carga el video y lo reproduce cuando es visible
                    if (!video.src) {
                        video.src = video.getAttribute('data-src');
                        video.classList.add('loaded');
                    }
                    video.play().catch(e => console.log("Autoplay prevenido:", e));
                } else {
                    // Pausa el video cuando sale de la pantalla para ahorrar RAM y batería
                    video.pause();
                }
            });
        }, { rootMargin: "0px 0px 200px 0px" });

        videos.forEach(video => videoObserver.observe(video));

        // 4. Lógica del Modal y WhatsApp
        const modal = document.getElementById('paymentModal');
        const waNumber = "51999999999"; // TU NÚMERO AQUÍ

        function openModal(nombreFondo) {
            document.getElementById('fondoName').innerText = nombreFondo;
            const waLink = document.getElementById('whatsappLink');
            const mensaje = encodeURIComponent(`Hola, acabo de pagar por el ${nombreFondo}. Te envío mi captura para recibir el enlace de Mega.`);
            waLink.href = `https://wa.me/${waNumber}?text=${mensaje}`;
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Cerrar modal al hacer clic fuera del contenido
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
