<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondos Animados Premium</title>
    <style>
        /* Estilos Generales y Modo Oscuro */
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a1a1a;
            padding: 20px;
            border-bottom: 2px solid #00d5a3;
        }
        h1 { margin: 0; font-size: 1.8rem; }
        
        /* Cuadrícula de Fondos */
        .grid { 
            display: flex; 
            gap: 25px; 
            justify-content: center; 
            flex-wrap: wrap; 
            padding: 40px 20px; 
        }
        .card { 
            background: #1a1a1a; 
            padding: 15px; 
            border-radius: 12px; 
            width: 260px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.02); }
        .preview-video { 
            width: 100%; 
            border-radius: 8px; 
            background: #000;
        }
        .card h3 { font-size: 1.1rem; margin: 15px 0 10px 0; }
        
        /* Botones */
        .btn { 
            background: #00d5a3; 
            color: #000; 
            border: none; 
            padding: 12px 20px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold; 
            width: 100%; 
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn:hover { background: #00b389; }
        .btn-wa { background: #25D366; color: white; margin-top: 15px; display: block; text-decoration: none;}
        .btn-wa:hover { background: #20bd5a; }

        /* Modal (Ventana emergente de pago) */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }
        .modal-content { 
            background: #1a1a1a; 
            padding: 30px; 
            border-radius: 12px; 
            text-align: center; 
            width: 90%; 
            max-width: 350px; 
            border: 1px solid #333;
        }
        .qr-container { 
            margin: 20px auto; 
            background: #fff; 
            padding: 10px; 
            border-radius: 8px; 
            display: inline-block;
        }
        .qr-container img { width: 200px; height: 200px; object-fit: contain; }
        .close-btn { 
            background: #ff4757; 
            color: white; 
            border: none; 
            padding: 10px; 
            cursor: pointer; 
            border-radius: 6px; 
            width: 100%; 
            margin-top: 10px; 
            font-weight: bold;
        }
        .close-btn:hover { background: #ff2e43; }
    </style>
</head>
<body>

    <header>
        <h1>Fondos Animados Premium</h1>
        <p>Lleva tu celular al siguiente nivel</p>
    </header>

    <div class="grid">
        <div class="card">
            <video class="preview-video" autoplay loop muted playsinline>
                <source src="assets/muestra_fondo1.mp4" type="video/mp4">
            </video>
            <h3>Galaxia Neón</h3>
            <button class="btn" onclick="openModal('Galaxia Neón')">Comprar - S/ 3.00</button>
        </div>

        <div class="card">
            <video class="preview-video" autoplay loop muted playsinline>
                <source src="assets/muestra_fondo2.mp4" type="video/mp4">
            </video>
            <h3>Cyberpunk City</h3>
            <button class="btn" onclick="openModal('Cyberpunk City')">Comprar - S/ 3.00</button>
        </div>
    </div>

    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #6e0f6e; margin-top: 0;">Pago con Yape</h2>
            <p>Fondo seleccionado: <strong id="fondoName"></strong></p>
            <p>1. Escanea el código QR desde tu app Yape.</p>
            
            <div class="qr-container">
                <img src="assets/tu_qr_yape.png" alt="Código QR de Yape">
            </div>

            <p>2. Envía la captura del pago para recibir tu enlace de descarga en máxima calidad.</p>
            
            <a href="https://wa.me/51999999999?text=Hola,%20acabo%20de%20pagar%20por%20el%20fondo:%20" id="whatsappLink" class="btn btn-wa" target="_blank">Enviar captura por WhatsApp</a>
            <button class="close-btn" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        function openModal(nombreFondo) {
            // Actualizar el nombre del fondo en el modal
            document.getElementById('fondoName').innerText = nombreFondo;
            
            // Personalizar el mensaje de WhatsApp según el fondo elegido
            const waLink = document.getElementById('whatsappLink');
            const baseUrl = "https://wa.me/51999999999?text="; // Recuerda cambiar el número aquí también
            const mensaje = encodeURIComponent("Hola, acabo de pagar por el fondo animado: " + nombreFondo);
            waLink.href = baseUrl + mensaje;

            // Mostrar el modal
            document.getElementById('paymentModal').style.display = 'flex';
        }

        function closeModal() {
            // Ocultar el modal
            document.getElementById('paymentModal').style.display = 'none';
        }
    </script>

</body>
</html>
